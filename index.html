<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Meridian Health — compassionate, technology-led hospital care. Book an appointment with expert doctors across cardiology, neurology, orthopedics, pediatrics and more."
    />
    <meta name="theme-color" content="#04735c" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Meridian Health — Better Health. Better Life.</title>
    <noscript>
      <!--
        Scroll reveals start at opacity:0 and are switched on by an
        IntersectionObserver. Without JS that observer never fires, so every
        revealed section would stay permanently invisible. This makes the
        content unconditionally visible instead.
      -->
      <style>
        [data-reveal] {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
